services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - dem_data:/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - postgis
    environment:
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_NAME=hydroplaner
      - DB_USER=hydroplaner
      - DB_PASSWORD=hydroplaner

  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hydroplaner
      POSTGRES_PASSWORD: hydroplaner
      POSTGRES_DB: hydroplaner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  dem_data:
